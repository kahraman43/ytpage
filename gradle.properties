# Gradle özellikleri
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
android.nonTransitiveRClass=false

# Build optimizasyonları
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Kotlin compiler optimizasyonları
kotlin.incremental=true
kotlin.incremental.java=true

# İmzalama bilgileri (GÜVENLİK: Bu değerleri asla Git'e eklemeyin!)
# Keystore oluşturduktan sonra bu değerleri doldurun:
# KEYSTORE_FILE=../keystore/simplecalc-release.jks
# KEYSTORE_PASSWORD=your_keystore_password
# KEY_ALIAS=simplecalc
# KEY_PASSWORD=your_key_password
